# Fetches free stock video candidates for a video's shot list and pushes them to a
# separate media branch (stock-media-v01), so large files never enter the work branches.
# Runs only when the queries file changes, or by hand.
name: fetch-stock
on:
  workflow_dispatch:
  push:
    paths:
      - inonda-youtube-videos/production/v01/stock/queries.json
      - tools/video/fetch_stock.py
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Which keys can this job see (names only)
        run: |
          echo "PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY != '' || vars.PIXABAY_API_KEY != '' }} PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY != '' || vars.PEXELS_API_KEY != '' }}"
      - name: Fetch clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || vars.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || vars.PEXELS_API_KEY }}
        run: python3 tools/video/fetch_stock.py inonda-youtube-videos/production/v01/stock/queries.json /tmp/media
      - name: Push to media branch
        run: |
          cd /tmp/media
          git init -q -b stock-media-v01
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Stock candidates for v01 (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" stock-media-v01
